version: '3.8'

services:
  energy-ai-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: energy-ai-agent
    restart: unless-stopped
    
    # Environment variables (override in .env file or docker-compose.override.yml)
    environment:
      - TZ=America/New_York
      # Email configuration
      - SENDER_EMAIL=${SENDER_EMAIL}
      - SENDER_PASSWORD=${SENDER_PASSWORD}
      - RECIPIENT_EMAILS=${RECIPIENT_EMAILS:-taransandhu@gillenergy.com,bikramgill@gillenergy.com,ravigill@gillenergy.com,kashmirgill@gillenergy.com}
      # API keys
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - EIA_API_KEY=${EIA_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - WORLD_NEWS_API_KEY=${WORLD_NEWS_API_KEY}
      # Schedule configuration
      - PREDICTION_TIMES=${PREDICTION_TIMES:-06:00,09:00,12:00,18:00}
      - PREDICTION_TIMEZONE=${PREDICTION_TIMEZONE:-US/Eastern}
      # Web dashboard (optional password for public internet)
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8080
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
    
    ports:
      - "8080:8080"
    
    # Mount data directory for persistence
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./dashboard:/app/dashboard
    
    # Keep container running
    stdin_open: true
    tty: true
    
    # Health check (optional)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/status', timeout=5)"]
      interval: 1h
      timeout: 10s
      retries: 3
      start_period: 10s
