version: '3.8'

services:
  energy-ai-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: energy-ai-agent
    restart: unless-stopped
    
    # Environment variables (override in .env file or docker-compose.override.yml)
    environment:
      - TZ=America/New_York
      # Email configuration
      - SENDER_EMAIL=${SENDER_EMAIL:-amuleeksidhu96@gmail.com}
      - SENDER_PASSWORD=${SENDER_PASSWORD}
      - RECIPIENT_EMAILS=${RECIPIENT_EMAILS:-amuleeksidhu96@gmail.com,rangi93@yahoo.com}
      # API keys
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-LS254MALFOC29HFY}
      - EIA_API_KEY=${EIA_API_KEY:-uBrIecJrka8gtd3bIDLkubzhL7Hc8G2NdIAnBYCj}
      - NEWS_API_KEY=${NEWS_API_KEY:-8886b39275f645a79cf2fb3d66d6d7b1}
      - WORLD_NEWS_API_KEY=${WORLD_NEWS_API_KEY:-e1a4d874e47646dfb3a8afe4691ba540}
      # Schedule configuration
      - PREDICTION_TIMES=${PREDICTION_TIMES:-06:00,09:00,12:00,18:00}
      - PREDICTION_TIMEZONE=${PREDICTION_TIMEZONE:-US/Eastern}
    
    # Mount data directory for persistence
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    
    # Keep container running
    stdin_open: true
    tty: true
    
    # Health check (optional)
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 1h
      timeout: 10s
      retries: 3
      start_period: 10s
