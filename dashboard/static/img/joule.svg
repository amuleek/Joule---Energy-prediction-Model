<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="j-bg" x1="18" y1="12" x2="82" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFAB40"/>
      <stop offset="1" stop-color="#E65100"/>
    </linearGradient>
    <radialGradient id="j-shine" cx="35%" cy="28%" r="50%">
