<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="55%" stop-color="#0f1419"/>
      <stop offset="100%" stop-color="#060a12"/>
    </radialGradient>
    <linearGradient id="arc" x1="20" y1="10" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#a78bfa;#f59e0b;#38bdf8" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#f59e0b;#38bdf8;#a78bfa" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#f59e0b">
        <animate attributeName="stop-color" values="#f59e0b;#38bdf8;#a78bfa;#f59e0b" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#bg)" stroke="#243047" stroke-width="1"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#38bdf8" stroke-width="0.6" opacity="0.15" stroke-dasharray="4 8">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="18s" repeatCount="indefinite"/>
  </circle>
  <path d="M 60 18 L 60 46 C 60 62 48 72 34 68 C 22 64 20 50 28 42 C 34 36 42 38 46 44"
    stroke="url(#arc)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  <circle cx="60" cy="18" r="4" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="r" values="3.5;5;3.5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="28" cy="42" r="2" fill="#f59e0b" opacity="0.9">
    <animate attributeName="cy" values="42;38;42" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="72" cy="58" r="1.5" fill="#a78bfa" opacity="0.8">
    <animate attributeName="cx" values="72;76;72" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
