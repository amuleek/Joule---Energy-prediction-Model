      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <filter id="j-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#j-bg)" filter="url(#j-shadow)"/>
  <circle cx="50" cy="50" r="46" fill="url(#j-shine)"/>
  <text x="50" y="71" text-anchor="middle"
    font-family="Nunito, 'Segoe UI', sans-serif" font-weight="800" font-size="50"
    fill="#FFF8F0" letter-spacing="-1">J</text>
  <g id="face">
    <g>
      <ellipse cx="40" cy="33" rx="5" ry="5.5" fill="#FFF8F0">
        <animate attributeName="ry" values="5.5;5.5;0.4;5.5;5.5" keyTimes="0;0.4;0.43;0.46;1" dur="4.2s" repeatCount="indefinite"/>
