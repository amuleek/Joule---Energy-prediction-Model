name: record-curve

# Weekdays ~30 min after NYMEX settle (14:30 ET), appends the futures curve
# to research/curve_history.csv and commits it.
on:
  workflow_dispatch:
  schedule:
    - cron: "15 20 * * 1-5"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas yfinance
      - run: python research/record_curve.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
          git add research/curve_history.csv
          git diff --cached --quiet || (git commit -m "Record futures curve $(date -u +%F)" && git push)
