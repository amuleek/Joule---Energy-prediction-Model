name: research-backtest

# Rebuilds the dataset and re-runs the walk-forward backtest.
# Weekly + on demand; also on pushes that touch research code.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 6"   # Saturdays 12:00 UTC
  push:
    branches: [main]
    paths: ["research/**", ".github/workflows/research-backtest.yml"]

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: pip install -r research/requirements.txt
      - name: Build dataset
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python research/build_dataset.py
      - name: Walk-forward backtest
        run: python research/backtest.py
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: research/results/
